# Sobe release/hostgator-sussurros-da-floresta/ → jhonatanribeiro.com/sussurros-da-floresta/
# Nunca sobrescreve data vivos no servidor (exclude + pacote sem leaderboard/tickets).
name: Deploy HostGator

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Face asset
        run: npm run gen:face

      - name: Build
        run: npm run build
        env:
          GAME_API_BASE: ${{ secrets.GAME_API_BASE }}

      - name: FTP upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          local-dir: ./release/hostgator-sussurros-da-floresta/
          server-dir: ${{ secrets.HOSTGATOR_FTP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/data/leaderboard.json
            **/data/tickets.json
            **/data/tickets-rate.json
            **/data/tickets-admin.key
            **/data/rooms/**
            **/.ftp-deploy-sync-state.json
