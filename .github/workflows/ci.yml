# CI — build do Sussurros da Floresta
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke — artefato HostGator
        run: |
          test -f release/hostgator-sussurros-da-floresta/index.html
          test -f release/hostgator-sussurros-da-floresta/game.js
          test -f release/hostgator-sussurros-da-floresta/styles/styles.css
          grep -q 'SDF_BUILD' release/hostgator-sussurros-da-floresta/index.html
