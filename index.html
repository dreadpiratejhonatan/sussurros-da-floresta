<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Sussurros da Floresta — explore a mata, ouça os sussurros e descubra o que a floresta esconde." />
  <meta name="theme-color" content="#1f3d2a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Sussurros da Floresta</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/styles.css?v=v1" />
  <script>
    window.SDF_BUILD = "v1";
    console.info("[Sussurros da Floresta] build", window.SDF_BUILD);
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <div id="hud" class="hud" hidden>
      <div id="crosshair" class="crosshair" aria-hidden="true"></div>
      <div id="prompt" class="prompt" hidden></div>
      <div id="toast" class="toast" hidden></div>
      <div class="hud__brand">SUSSURROS DA FLORESTA</div>
      <div id="objective" class="hud__objective">Siga os sussurros. Explore a clareira.</div>
      <button type="button" id="btn-pause" class="hud__pause" aria-label="Pausar">Ⅱ</button>
      <div class="hud__hint" id="hud-hint">WASD mover · mouse olhar · E interagir · Esc pausar</div>
    </div>

    <div id="pause" class="pause" hidden>
      <div class="pause__card">
        <h2 class="pause__title">Pausado</h2>
        <p class="pause__sub">A floresta espera em silêncio.</p>
        <button type="button" class="menu__btn" id="btn-resume">Continuar</button>
        <button type="button" class="pause__link" id="btn-menu">Voltar ao menu</button>
      </div>
    </div>

    <div id="menu" class="menu" aria-hidden="false">
      <div class="menu__bg" aria-hidden="true"></div>
      <div class="menu__card">
        <p class="menu__kicker">Uma caminhada na mata</p>
        <h1 class="menu__title">SUSSURROS<br /><span class="menu__title-sub">DA FLORESTA</span></h1>
        <p class="menu__sub">Entre na névoa, ouça o que as árvores murmuram e descubra o coração da floresta.</p>
        <button type="button" class="menu__btn" id="btn-play">Entrar na floresta</button>
      </div>
    </div>

    <div id="touch-controls" class="touch" hidden>
      <div id="touch-look" class="touch__look" aria-hidden="true"></div>
      <div id="touch-stick" class="touch__stick" aria-label="Mover">
        <div id="touch-knob" class="touch__knob"></div>
      </div>
      <button type="button" id="touch-interact" class="touch__btn" aria-label="Interagir">E</button>
    </div>
  </div>

  <script type="module" src="src/js/main.js?v=v1"></script>
</body>
</html>
